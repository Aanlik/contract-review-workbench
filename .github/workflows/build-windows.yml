name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "backend[ocr-all]"
          python -m pip install pyinstaller

      - name: Verify bundled OCR imports
        run: |
          @'
          import importlib.util
          packages = ["rapidocr", "onnxruntime", "paddle", "paddleocr"]
          missing = [name for name in packages if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"Missing OCR packages: {missing}")
          print("OCR imports OK:", ", ".join(packages))
          '@ | python

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Build Windows executable
        run: |
          pyinstaller backend/contract_review.spec --clean --noconfirm

      - name: Setup distribution
        run: |
          New-Item -ItemType Directory -Force -Path "dist\contract-review\data\storage" | Out-Null
          Set-Content -Path "dist\contract-review\.env" -Value "# Contract Review Workbench" -Encoding UTF8

      - name: Create start script
        run: |
          $content = @'
          @echo off
          title Contract Review Workbench
          echo ==========================================
          echo   Contract Review Workbench
          echo   http://127.0.0.1:8000
          echo ==========================================
          echo.
          contract-review.exe
          pause
          '@
          Set-Content -Path "dist\contract-review\start.bat" -Value $content

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "dist\contract-review\*" -DestinationPath "contract-review-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-review-windows
          path: contract-review-windows.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: contract-review-windows.zip
          draft: false
          prerelease: false
