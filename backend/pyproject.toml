[project]
name = "contract-review-workbench-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "python-docx>=1.0.0",
  "cryptography>=42.0.0",
  "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]
ocr-rapid = [
  "rapidocr==3.9.2",
  "onnxruntime==1.28.0",
]
ocr-rapid-legacy = [
  "rapidocr-onnxruntime>=1.3.19",
]
ocr-paddle = [
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
]
ocr-all = [
  "rapidocr==3.9.2",
  "onnxruntime==1.28.0",
  "paddlepaddle==3.3.1",
  "paddleocr==3.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
  # FastAPI intentionally uses Depends/Form/File/Query calls as parameter defaults.
  "B008",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]
